<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const makePromise = new Promise((resolve, reject) => {
            const car = {
                make: 1989,
                model: "bwm",
                brand: "nnb"
            }
            setTimeout(() => { resolve(car) }, 3000);
        });
        makePromise.then((data) => {
            return { ...data, model: "G10", brand: "bwm" }
        })
            .then(prevPromiseData => console.log(prevPromiseData));
    </script>
</body>

</html>
