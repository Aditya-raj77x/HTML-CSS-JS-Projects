<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        #map {
            height: 400px;
            width: 100%;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

</head>

<body>
    <h2>Latitude : <span class="lat"></span></h2>
    <h2>Longitude : <span class="lan"></span> </h2>
    <h2>Altitude : <span class="val"></span> </h2>
    <h2>Velocity : <span class="al"></span> </h2>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([0, 0], 3);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const isMarker = L.marker([0, 0]).addTo(map)
        const lan = document.querySelector(".lan");
        const lat = document.querySelector(".lat");
        const val = document.querySelector(".val");
        const al = document.querySelector(".al");
        getISSdata = async () => {
            try {
                let res = await fetch("https://api.wheretheiss.at/v1/satellites/25544")
                const { latitude, longitude, altitude, velocity } = await res.json()
                console.log(latitude, longitude, altitude, velocity)
                lan.innerHTML = longitude.toFixed(5)
                lat.innerHTML = latitude.toFixed(5)
                val.innerHTML = velocity.toFixed(0)
                al.innerHTML = altitude.toFixed(0)
                map.setView([latitude, longitude])
                isMarker.setLatLng([latitude, longitude])

            }
            catch {
                console.log("something went wrong!!")
            }
        }
        getISSdata()
    </script>
</body>

</html>
